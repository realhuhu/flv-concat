name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build or restore minimal FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-minimal-ffmpeg
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          "-DFFMPEG_ROOT=${{ steps.ffmpeg.outputs.root }}"
          -DFLVCONCAT_FFMPEG_AOM_STUB=ON
          -DFLVCONCAT_BUILD_TESTS=ON
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          .\build\Release\flvconcat.exe --version
      - name: Package
        shell: pwsh
        run: |
          $executable = Get-Item "build/Release/flvconcat.exe"
          $maxExecutableBytes = 4MB
          if ($executable.Length -gt $maxExecutableBytes) {
            throw "flvconcat.exe is $($executable.Length) bytes; expected a minimal build no larger than $maxExecutableBytes bytes"
          }
          "Windows executable: $($executable.Length) bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          $name = "flvconcat-$env:GITHUB_REF_NAME-windows-x64"
          $root = Join-Path "dist" $name
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item "build/Release/flvconcat.exe" $root
          Copy-Item "README.md", "README_EN.md", "LICENSE", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md" $root
          Compress-Archive -Path $root -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows
          path: |
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libavformat-dev libavcodec-dev libavutil-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFLVCONCAT_BUILD_TESTS=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./build/flvconcat --version
      - name: Package
        run: |
          executable=build/flvconcat
          test -x "$executable"
          name="flvconcat-${GITHUB_REF_NAME}-linux-x64"
          root="dist/$name"
          mkdir -p "$root"
          cp "$executable" README.md README_EN.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "$root/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          size=$(stat -c '%s' "$executable")
          echo "Linux executable: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-linux
          path: dist
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "FLVConcat $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
