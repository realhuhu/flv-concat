name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: ./build/flvconcat --version

  windows:
    name: Windows x64 / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build or restore minimal FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-minimal-ffmpeg
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          "-DFFMPEG_ROOT=${{ steps.ffmpeg.outputs.root }}"
          -DFLVCONCAT_FFMPEG_AOM_STUB=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: CLI smoke test
        run: .\build\Release\flvconcat.exe --version
