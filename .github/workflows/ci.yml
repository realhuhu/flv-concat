name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: ./build/flvconcat --version

  windows:
    name: Windows x64 / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: build/vcpkg_installed
          key: vcpkg-windows-x64-static-${{ hashFiles('vcpkg.json') }}
      - name: Fetch pinned vcpkg baseline
        shell: pwsh
        run: git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin f1d4bbc72f183441403ba5107cb19d75a5abc2a2 --depth=1
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: CLI smoke test
        run: .\build\Release\flvconcat.exe --version
