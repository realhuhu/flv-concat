name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
      - name: Build or restore minimal static FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-minimal-ffmpeg-linux
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DFFMPEG_ROOT=${{ steps.ffmpeg.outputs.root }}" \
            -DFLVCONCAT_FFMPEG_STATIC=ON \
            -DFLVCONCAT_FFMPEG_AOM_STUB=ON
          cmake --build build --parallel
      - uses: github/codeql-action/analyze@v4
